name: Build APK
on:
  push: { paths: ['zimyo-app/**', '.github/workflows/build-apk.yml'] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p zimyo-app assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: zimyo-clock-apk, path: zimyo-app/app/build/outputs/apk/debug/app-debug.apk }
